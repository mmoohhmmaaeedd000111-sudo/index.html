<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>ZMEX Admin Master | Uday</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 p-6 font-sans">

    <div id="lockScreen" class="max-w-md mx-auto mt-20 bg-white p-10 rounded-[3rem] shadow-2xl text-center border-t-8 border-slate-900">
        <h2 class="text-3xl font-black mb-10 italic uppercase tracking-tighter text-slate-900">Admin Lock</h2>
        <input type="password" id="adminKey" placeholder="أدخل رمز الوصول الخاص بك" class="w-full p-5 border rounded-2xl mb-6 text-center outline-none bg-gray-50 focus:border-slate-900">
        <button onclick="unlock()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-lg shadow-xl shadow-slate-100">فتح اللوحة</button>
    </div>

    <div id="adminPanel" class="hidden max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-10 bg-white p-8 rounded-[3rem] shadow-sm border border-gray-100">
            <div>
                <h1 class="text-2xl font-black italic text-slate-900">ZMEX MASTER CONTROL</h1>
                <p class="text-[10px] text-gray-400 font-black tracking-widest uppercase">Supervisor: Muhammad Uday</p>
            </div>
            <button onclick="location.reload()" class="bg-red-50 text-red-500 px-8 py-3 rounded-2xl text-xs font-black uppercase border border-red-100">تسجيل خروج</button>
        </div>

        <h2 class="font-black text-xs mb-5 text-amber-600 uppercase italic flex items-center gap-2"><i class="fas fa-money-bill-transfer animate-pulse"></i> طلبات السحب الواردة (بالاسم والمحفظة):</h2>
        <div id="withdrawalsList" class="grid gap-4 mb-16"></div>

        <h2 class="font-black text-xs mb-5 text-slate-800 uppercase italic flex items-center gap-2"><i class="fas fa-user-gear"></i> إدارة أرصدة وحسابات المستخدمين:</h2>
        <div id="usersList" class="grid gap-4"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiw6jHMsmXn89X4okEMfUv9J44suexwEg",
            authDomain: "zmex-81334.firebaseapp.com",
            projectId: "zmex-81334",
            storageBucket: "zmex-81334.firebasestorage.app",
            messagingSenderId: "584801874362",
            appId: "1:584801874362:web:1e20ed9c9b67614bafad83"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function unlock() {
            if(document.getElementById('adminKey').value === "uday2025") {
                document.getElementById('lockScreen').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadAdminData();
            } else { alert("الرمز خطأ!"); }
        }

        function loadAdminData() {
            // استقبال بيانات السحب (اسم + محفظة + مبلغ)
            db.collection('withdrawals').orderBy('timestamp', 'desc').onSnapshot(snap => {
                const wDiv = document.getElementById('withdrawalsList');
                wDiv.innerHTML = snap.empty ? "<p class='text-xs text-gray-400 p-10 bg-white rounded-3xl text-center shadow-inner'>لا يوجد طلبات سحب حالياً.</p>" : "";
                snap.forEach(doc => {
                    const w = doc.data();
                    wDiv.innerHTML += `
                        <div class="bg-white p-7 rounded-[2.5rem] border-r-8 border-amber-500 shadow-sm flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="text-right w-full">
                                <b class="text-slate-800 text-lg block uppercase">${w.userName}</b>
                                <p class="text-[10px] text-gray-400 font-bold mb-3 uppercase">البريد: ${w.userEmail}</p>
                                <div class="bg-slate-50 p-3 rounded-xl border border-gray-100 mb-3">
                                    <p class="text-[9px] text-amber-600 font-black mb-1 uppercase">محفظة المستخدم (TRC20):</p>
                                    <code class="text-[11px] font-mono font-black text-slate-700 break-all">${w.walletAddr}</code>
                                </div>
                                <b class="text-3xl text-green-600 font-black italic">$${w.amount} USDT</b>
                            </div>
                            <button onclick="confirmWithdraw('${doc.id}')" class="bg-slate-900 text-white px-10 py-5 rounded-2xl text-[10px] font-black uppercase shadow-xl hover:bg-black transition-all">تم التحويل / حذف</button>
                        </div>
                    `;
                });
            });

            // قائمة المستخدمين للتعديل
            db.collection('users').onSnapshot(snap => {
                const uDiv = document.getElementById('usersList');
                uDiv.innerHTML = "";
                snap.forEach(doc => {
                    const u = doc.data();
                    uDiv.innerHTML += `
                        <div class="bg-white p-6 rounded-[2.5rem] shadow-sm flex justify-between items-center border border-gray-100">
                            <div><b class="text-sm uppercase block">${u.name}</b><p class="text-[10px] text-gray-400 font-bold">${u.email}</p></div>
                            <div class="flex items-center gap-4">
                                <b class="text-xl text-amber-500 italic font-mono">$${(u.balance || 0).toFixed(2)}</b>
                                <div class="flex flex-col gap-2">
                                    <button onclick="changeBal('${doc.id}', 100)" class="bg-green-500 text-white px-4 py-1.5 rounded-xl text-[10px] font-black shadow-sm">+100</button>
                                    <button onclick="changeBal('${doc.id}', -100)" class="bg-red-500 text-white px-4 py-1.5 rounded-xl text-[10px] font-black shadow-sm">-100</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function changeBal(id, val) {
            db.collection('users').doc(id).update({ balance: firebase.firestore.FieldValue.increment(val) });
        }

        function confirmWithdraw(id) {
            if(confirm("هل قمت بتحويل المال للمستخدم وتأكدت من المحفظة؟")) db.collection('withdrawals').doc(id).delete();
        }
    </script>
</body>
</html>
