<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>دخول الإدارة | ZMEX</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        body { background-color: #020617; color: white; font-family: 'Segoe UI', sans-serif; }
        .hidden { display: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">

    <div id="loginBox" class="w-full max-w-sm bg-slate-900 border border-white/10 p-8 rounded-[2rem] text-center shadow-2xl">
        <div class="w-16 h-16 bg-amber-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-lock text-amber-500 text-2xl"></i>
        </div>
        <h2 class="text-xl font-bold mb-6">تحقق الهوية (مشرف الموقع)</h2>
        <input type="password" id="adminPass" placeholder="أدخل رمز الدخول السري" 
               class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-center mb-4 outline-none focus:border-amber-500 transition-all">
        <button onclick="checkPass()" class="w-full bg-amber-500 text-slate-900 font-black py-3 rounded-xl shadow-lg active:scale-95 transition-all">دخول للإدارة</button>
    </div>

    <div id="adminPanel" class="hidden w-full max-w-4xl animate-in fade-in duration-500">
        <div class="flex justify-between items-center mb-10 border-b border-white/5 pb-6">
            <h1 class="text-3xl font-black text-amber-500 italic">ZMEX ADMIN</h1>
            <button onclick="location.reload()" class="bg-red-500/10 text-red-500 px-4 py-2 rounded-lg text-xs font-bold">تسجيل خروج</button>
        </div>
        
        <div id="usersList" class="grid gap-6">
            </div>
    </div>

    <script>
        // --- ضع رمزك السري هنا ---
        const SECRET_CODE = "123456"; // أستاذ محمد، غيّر هذا الرقم ليكون رمزك الخاص

        function checkPass() {
            const input = document.getElementById('adminPass').value;
            if(input === SECRET_CODE) {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('adminPanel').classList.remove('hidden');
                loadUsers(); // بدء تحميل البيانات بعد التأكد من الرمز
            } else {
                alert("الرمز السري غير صحيح!");
            }
        }

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyAiw6jHMsmXn89X4okEMfUv9J44suexwEg",
            authDomain: "zmex-81334.firebaseapp.com",
            projectId: "zmex-81334",
            storageBucket: "zmex-81334.firebasestorage.app",
            messagingSenderId: "584801874362",
            appId: "1:584801874362:web:1e20ed9c9b67614bafad83"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function loadUsers() {
            db.collection("users").orderBy("joinedAt", "desc").onSnapshot(snap => {
                const container = document.getElementById("usersList");
                container.innerHTML = "";
                snap.forEach(doc => {
                    const u = doc.data();
                    container.innerHTML += `
                        <div class="bg-slate-900 p-6 rounded-3xl border border-white/5 shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
                            <div class="text-right flex-1">
                                <h3 class="font-bold text-lg">${u.name}</h3>
                                <p class="text-xs text-slate-500">الرصيد: <span class="text-green-400 font-mono">$${(u.balance || 0).toFixed(2)}</span></p>
                                ${u.activePlan ? '<span class="text-[8px] bg-green-500/20 text-green-500 px-2 py-0.5 rounded">خطة نشطة</span>' : '<span class="text-[8px] bg-red-500/20 text-red-500 px-2 py-0.5 rounded">لا توجد خطة</span>'}
                            </div>
                            <div class="flex gap-2">
                                <button onclick="updateBalance('${doc.id}', 10)" class="bg-slate-800 hover:bg-amber-500 hover:text-black px-4 py-2 rounded-xl text-xs font-bold transition-all">+$10</button>
                                <button onclick="updateBalance('${doc.id}', 50)" class="bg-slate-800 hover:bg-amber-500 hover:text-black px-4 py-2 rounded-xl text-xs font-bold transition-all">+$50</button>
                                <button onclick="activatePlan('${doc.id}')" class="bg-amber-500 text-slate-900 px-4 py-2 rounded-xl text-xs font-black transition-all">تفعيل الربح</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        async function updateBalance(id, amt) {
            await db.collection("users").doc(id).update({
                balance: firebase.firestore.FieldValue.increment(amt)
            });
        }

        async function activatePlan(id) {
            const ref = db.collection("users").doc(id);
            const userDoc = await ref.get();
            const currentBalance = userDoc.data().balance;

            if(currentBalance <= 0) return alert("رصيد المستخدم 0!");

            await ref.update({
                activePlan: true,
                investedAmount: currentBalance,
                lastProfitUpdate: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("تم بدء الاستثمار بنجاح ✅");
        }
    </script>
</body>
</html>
