<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>ZMEX Master Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 p-5 font-sans">

    <div id="adminAuth" class="max-w-md mx-auto bg-white p-10 rounded-3xl shadow-xl mt-20 text-center">
        <h2 class="text-2xl font-black mb-6 italic">ZMEX ADMIN LOGIN</h2>
        <input type="password" id="adminPass" placeholder="رمز المشرف" class="w-full p-4 border rounded-2xl mb-4 text-center">
        <button onclick="checkAdmin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black">فتح اللوحة</button>
    </div>

    <div id="adminPanel" class="hidden max-w-5xl mx-auto pb-20">
        <h1 class="text-2xl font-black mb-8">إدارة منصة ZMEX</h1>
        
        <h2 class="font-black text-sm mb-4 text-red-500 italic">طلبات السحب الواردة (هنا تصلك بيانات المستخدم):</h2>
        <div id="withdrawalsList" class="grid gap-4 mb-10">
            <p class="text-xs text-gray-400">لا توجد طلبات سحب حالياً.</p>
        </div>

        <h2 class="font-black text-sm mb-4 text-slate-700 italic">المستخدمين:</h2>
        <div id="usersList" class="grid gap-4"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiw6jHMsmXn89X4okEMfUv9J44suexwEg",
            authDomain: "zmex-81334.firebaseapp.com",
            projectId: "zmex-81334",
            storageBucket: "zmex-81334.firebasestorage.app",
            messagingSenderId: "584801874362",
            appId: "1:584801874362:web:1e20ed9c9b67614bafad83"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function checkAdmin() {
            if(document.getElementById('adminPass').value === "uday2025") {
                document.getElementById('adminAuth').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                startListening();
            } else { alert("الرمز خاطئ!"); }
        }

        function startListening() {
            // الاستماع لطلبات السحب (المحفظة والمبلغ والاسم)
            db.collection('withdrawals').orderBy('timestamp', 'desc').onSnapshot(snap => {
                const wList = document.getElementById('withdrawalsList');
                wList.innerHTML = "";
                snap.forEach(doc => {
                    const data = doc.data();
                    wList.innerHTML += `
                        <div class="bg-amber-50 p-5 rounded-2xl border border-amber-200 shadow-sm">
                            <b class="text-sm block">الاسم: ${data.userName}</b>
                            <p class="text-[10px] text-gray-500">رابط المحفظة: <span class="font-bold text-slate-900">${data.walletAddr}</span></p>
                            <b class="text-lg text-green-600">المبلغ: $${data.amount}</b>
                            <button onclick="deleteReq('${doc.id}')" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-[10px] block mt-2">حذف الطلب</button>
                        </div>
                    `;
                });
            });

            db.collection('users').onSnapshot(snap => {
                const uList = document.getElementById('usersList');
                uList.innerHTML = "";
                snap.forEach(doc => {
                    const u = doc.data();
                    uList.innerHTML += `
                        <div class="bg-white p-5 rounded-2xl shadow-sm flex justify-between items-center">
                            <div><b class="text-sm">${u.name}</b><p class="text-[10px] text-gray-400">${u.email}</p></div>
                            <div class="flex items-center gap-3">
                                <b class="text-amber-500 font-mono">$${(u.balance || 0).toFixed(2)}</b>
                                <button onclick="updateBal('${doc.id}', 100)" class="bg-green-500 text-white px-3 py-1 rounded-lg text-xs">+100</button>
                                <button onclick="updateBal('${doc.id}', -100)" class="bg-red-500 text-white px-3 py-1 rounded-lg text-xs">-100</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function updateBal(id, amt) {
            db.collection('users').doc(id).update({ balance: firebase.firestore.FieldValue.increment(amt) });
        }

        function deleteReq(id) {
            if(confirm("حذف الطلب؟")) db.collection('withdrawals').doc(id).delete();
        }
    </script>
</body>
</html>
