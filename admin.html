<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ZMEX Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div id="login" class="max-w-sm mx-auto bg-white p-8 rounded-3xl shadow-lg mt-20">
        <h2 class="font-black text-center mb-4">دخول المشرف</h2>
        <input type="password" id="p" class="w-full border p-4 rounded-xl mb-4 text-center">
        <button onclick="if(document.getElementById('p').value==='123456'){document.getElementById('login').style.display='none';document.getElementById('pnl').style.display='block';load()}" class="w-full bg-amber-500 p-4 rounded-xl font-bold">دخول</button>
    </div>

    <div id="pnl" class="hidden max-w-4xl mx-auto">
        <h1 class="text-2xl font-black mb-8">طلبات المستخدمين</h1>
        <div id="u" class="space-y-4"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiw6jHMsmXn89X4okEMfUv9J44suexwEg",
            authDomain: "zmex-81334.firebaseapp.com",
            projectId: "zmex-81334",
            storageBucket: "zmex-81334.firebasestorage.app",
            messagingSenderId: "584801874362",
            appId: "1:584801874362:web:1e20ed9c9b67614bafad83"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function load() {
            db.collection('users').onSnapshot(s => {
                const l = document.getElementById('u');
                l.innerHTML = "";
                s.forEach(d => {
                    const u = d.data();
                    l.innerHTML += `<div class="bg-white p-6 rounded-3xl shadow flex justify-between">
                        <div><b>${u.name}</b><br><small>${u.email}</small><br><b class="text-green-600">$${u.balance}</b></div>
                        <button onclick="add('${d.id}')" class="bg-green-100 p-3 rounded-xl">+100$</button>
                    </div>`;
                });
            });
        }
        async function add(id) {
            await db.collection('users').doc(id).update({balance: firebase.firestore.FieldValue.increment(100)});
        }
    </script>
</body>
</html>
