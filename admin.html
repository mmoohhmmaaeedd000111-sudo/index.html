<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>إدارة ZMEX</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">

    <div id="lock" class="max-w-sm mx-auto bg-white p-10 rounded-3xl shadow-xl mt-20 text-center">
        <h2 class="font-black mb-4">الدخول للوحة التحكم</h2>
        <input type="password" id="adminKey" placeholder="أدخل رمز المشرف" class="w-full border p-4 rounded-xl mb-4 text-center outline-none">
        <button onclick="checkAdmin()" class="w-full bg-amber-500 p-4 rounded-xl font-black">فتح اللوحة</button>
    </div>

    <div id="panel" class="hidden max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10 bg-slate-800 text-white p-6 rounded-2xl">
            <h1 class="text-2xl font-black">إدارة المنصة</h1>
            <button onclick="location.reload()" class="bg-red-500 px-4 py-1 rounded-lg text-xs">خروج</button>
        </div>
        <div id="users" class="space-y-4"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiw6jHMsmXn89X4okEMfUv9J44suexwEg",
            authDomain: "zmex-81334.firebaseapp.com",
            projectId: "zmex-81334",
            storageBucket: "zmex-81334.firebasestorage.app",
            messagingSenderId: "584801874362",
            appId: "1:584801874362:web:1e20ed9c9b67614bafad83"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function checkAdmin() {
            // الرمز السري هو uday2025 يمكنك تغييره هنا
            if(document.getElementById('adminKey').value === "uday2025") {
                document.getElementById('lock').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
                loadUsers();
            } else { alert("الرمز خاطئ!"); }
        }

        function loadUsers() {
            db.collection('users').onSnapshot(snap => {
                const list = document.getElementById('users');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const u = doc.data();
                    list.innerHTML += `
                        <div class="bg-white p-6 rounded-2xl shadow-sm flex justify-between items-center">
                            <div>
                                <h3 class="font-black">${u.name}</h3>
                                <p class="text-[10px] text-gray-400 font-mono">${u.email}</p>
                                <p class="text-green-600 font-bold">$${(u.balance || 0).toFixed(2)}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="updateBal('${doc.id}', 100)" class="bg-green-100 text-green-700 px-4 py-2 rounded-xl text-xs font-bold">+100$</button>
                                <button onclick="updateBal('${doc.id}', -100)" class="bg-red-100 text-red-700 px-4 py-2 rounded-xl text-xs font-bold">-100$</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        async function updateBal(id, amt) {
            await db.collection('users').doc(id).update({
                balance: firebase.firestore.FieldValue.increment(amt)
            });
        }
    </script>
</body>
</html>
