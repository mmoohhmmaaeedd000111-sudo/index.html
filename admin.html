<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>ZMEX | لوحة التحكم الآمنة</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">

    <div id="loginAdmin" class="max-w-sm mx-auto bg-white p-10 rounded-3xl shadow-xl mt-20 text-center">
        <i class="fas fa-user-shield text-5xl text-amber-500 mb-4"></i>
        <h2 class="font-black text-xl mb-4">دخول المشرف الآمن</h2>
        <input type="password" id="adminKey" placeholder="أدخل رمز المرور" class="w-full border p-4 rounded-xl mb-4 text-center outline-none focus:ring-2 ring-amber-500">
        <button onclick="accessPanel()" class="w-full bg-amber-500 p-4 rounded-xl font-black text-white">دخول اللوحة</button>
    </div>

    <div id="panel" class="hidden max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-10 bg-slate-800 text-white p-6 rounded-2xl shadow-lg">
            <h1 class="text-2xl font-black">إدارة مستخدمي ZMEX</h1>
            <span class="bg-green-500 px-4 py-1 rounded-full text-xs">متصل الآن</span>
        </div>
        
        <div id="userList" class="grid gap-6">
            </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiw6jHMsmXn89X4okEMfUv9J44suexwEg",
            authDomain: "zmex-81334.firebaseapp.com",
            projectId: "zmex-81334",
            storageBucket: "zmex-81334.firebasestorage.app",
            messagingSenderId: "584801874362",
            appId: "1:584801874362:web:1e20ed9c9b67614bafad83"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function accessPanel() {
            const key = document.getElementById('adminKey').value;
            if(key === "uday2025") { // هذا هو الرمز السري الخاص بك (يمكنك تغييره)
                document.getElementById('loginAdmin').style.display = 'none';
                document.getElementById('panel').style.display = 'block';
                loadAllUsers();
            } else {
                alert("الرمز السري خاطئ! يرجى المحاولة مرة أخرى.");
            }
        }

        function loadAllUsers() {
            db.collection('users').onSnapshot(snap => {
                const container = document.getElementById('userList');
                container.innerHTML = "";
                snap.forEach(doc => {
                    const u = doc.data();
                    container.innerHTML += `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border flex justify-between items-center">
                            <div>
                                <h3 class="font-black text-lg">${u.name}</h3>
                                <p class="text-xs text-gray-400 font-mono">${u.email}</p>
                                <p class="text-green-600 font-bold mt-2">الرصيد: $${(u.balance || 0).toFixed(2)}</p>
                            </div>
                            <div class="flex flex-col gap-2">
                                <button onclick="updateBalance('${doc.id}', 100)" class="bg-green-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm">+ $100</button>
                                <button onclick="updateBalance('${doc.id}', -50)" class="bg-red-500 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm">- $50</button>
                                <button onclick="deleteUser('${doc.id}')" class="text-red-300 text-[10px] mt-2 underline">حذف الحساب</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        async function updateBalance(id, amount) {
            await db.collection('users').doc(id).update({
                balance: firebase.firestore.FieldValue.increment(amount)
            });
        }

        async function deleteUser(id) {
            if(confirm("هل أنت متأكد من حذف هذا المستخدم نهائياً؟")) {
                await db.collection('users').doc(id).delete();
            }
        }
    </script>
</body>
</html>
