<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>ZMEX Master Admin | uday</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 p-4 font-sans text-right">

    <div id="adminAuth" class="max-w-md mx-auto bg-white p-10 rounded-[3rem] shadow-2xl mt-20 text-center">
        <h2 class="text-3xl font-black mb-8 italic">ADMIN LOGIN</h2>
        <input type="password" id="adminPass" placeholder="رمز المشرف" class="w-full p-5 border rounded-2xl mb-4 text-center outline-none">
        <button onclick="checkAdmin()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black shadow-xl">فتح النظام</button>
    </div>

    <div id="adminPanel" class="hidden max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-10 bg-white p-6 rounded-[2rem] shadow-sm">
            <div>
                <h1 class="text-2xl font-black">ZMEX Control Center</h1>
                <p class="text-xs text-gray-400 font-bold">Supervisor: Muhammad Uday</p>
            </div>
            <button onclick="location.reload()" class="bg-red-50 text-red-500 px-6 py-3 rounded-2xl text-xs font-black">خروج</button>
        </div>

        <h2 class="font-black text-sm mb-4 text-amber-600"><i class="fas fa-bell ml-2"></i> طلبات السحب الواردة (بيانات المستخدمين):</h2>
        <div id="withdrawalsList" class="grid gap-4 mb-12">
            </div>

        <h2 class="font-black text-sm mb-4 text-slate-800 italic">إدارة أرصدة المستخدمين:</h2>
        <div id="usersList" class="grid gap-4"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAiw6jHMsmXn89X4okEMfUv9J44suexwEg",
            authDomain: "zmex-81334.firebaseapp.com",
            projectId: "zmex-81334",
            storageBucket: "zmex-81334.firebasestorage.app",
            messagingSenderId: "584801874362",
            appId: "1:584801874362:web:1e20ed9c9b67614bafad83"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function checkAdmin() {
            if(document.getElementById('adminPass').value === "uday2025") {
                document.getElementById('adminAuth').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                startAdmin();
            } else { alert("الرمز خطأ!"); }
        }

        function startAdmin() {
            // استقبال بيانات السحب (اسم، محفظة، مبلغ)
            db.collection('withdrawals').orderBy('timestamp', 'desc').onSnapshot(snap => {
                const wList = document.getElementById('withdrawalsList');
                wList.innerHTML = "";
                snap.forEach(doc => {
                    const w = doc.data();
                    wList.innerHTML += `
                        <div class="bg-amber-50 p-6 rounded-[2rem] border border-amber-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <div>
                                <b class="block text-slate-800">الاسم: ${w.userName}</b>
                                <p class="text-[10px] text-amber-700 font-mono">المحفظة: ${w.walletAddr}</p>
                                <b class="text-xl text-green-600 mt-2 block">$${w.amount} USDT</b>
                            </div>
                            <button onclick="deleteReq('${doc.id}')" class="bg-slate-900 text-white px-8 py-3 rounded-xl text-xs font-bold">تم الدفع / حذف</button>
                        </div>
                    `;
                });
            });

            // قائمة المستخدمين
            db.collection('users').onSnapshot(snap => {
                const list = document.getElementById('usersList');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const u = doc.data();
                    list.innerHTML += `
                        <div class="bg-white p-6 rounded-[2rem] shadow-sm flex justify-between items-center">
                            <div><b class="text-sm">${u.name}</b><p class="text-[10px] text-gray-400">${u.email}</p></div>
                            <div class="flex items-center gap-4">
                                <b class="text-amber-500 font-mono italic">$${(u.balance || 0).toFixed(2)}</b>
                                <button onclick="updateBal('${doc.id}', 100)" class="bg-green-500 text-white px-3 py-1 rounded-lg text-xs">+100</button>
                                <button onclick="updateBal('${doc.id}', -100)" class="bg-red-500 text-white px-3 py-1 rounded-lg text-xs">-100</button>
                            </div>
                        </div>
                    `;
                });
            });
        }

        function updateBal(id, amt) {
            db.collection('users').doc(id).update({ balance: firebase.firestore.FieldValue.increment(amt) });
        }

        function deleteReq(id) {
            if(confirm("هل تريد إزالة هذا الطلب؟")) db.collection('withdrawals').doc(id).delete();
        }
    </script>
</body>
</html>
